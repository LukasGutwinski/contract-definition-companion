  <title id="gut-ventures-logo-title">GUT Ventures</title>
  <style>
    .gut-draw {
      fill-opacity: 0;
      stroke: #47d3f2;
      stroke-width: 2;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation:
        gut-draw 2s linear forwards,
        gut-reveal 700ms ease 2.1s forwards;
    }

    @keyframes gut-draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes gut-reveal {
      from { fill-opacity: 0; stroke-opacity: 1; }
      to { fill-opacity: 1; stroke-opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gut-draw {
        animation: none;
        fill-opacity: 1;
        stroke: none;
      }
    }
  </style>
